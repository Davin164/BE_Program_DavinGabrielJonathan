name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: gdgoc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/gdgoc_test
          NODE_ENV: test

      - name: Run test suite
        run: |
          npm test -- --verbose 2>&1 | tee test-output.txt
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/gdgoc_test
          JWT_SECRET: test-secret-key-minimum-32-chars-long-12345
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-chars-long-67890
          NODE_ENV: test

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Jest Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
